<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eine Frage an dich · Mortys Welt</title>
<link rel="icon" type="image/x-icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a12; --panel:rgba(18,18,28,.66); --line:rgba(255,255,255,.08);
    --gelb:#FFE44E; --gelb-soft:rgba(255,228,78,.14);
    --signal:#54E6C5; --signal-soft:rgba(84,230,197,.12);
    --txt:#EDEDF4; --muted:rgba(237,237,244,.55); --no:#FF6B7A;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--txt);
    background:
      radial-gradient(1200px 760px at 16% -12%, rgba(255,228,78,.07), transparent 58%),
      radial-gradient(1000px 680px at 90% 112%, rgba(84,230,197,.09), transparent 60%),
      var(--bg);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 18px;overflow:hidden;position:relative;
  }
  body.party{animation:bgparty 2.2s linear infinite}
  @keyframes bgparty{
    0%{background-color:#0a0a12}25%{background-color:#15122a}
    50%{background-color:#0a1f1c}75%{background-color:#241a05}100%{background-color:#0a0a12}}

  .starfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .starfield i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}

  #fx{position:fixed;inset:0;z-index:6;pointer-events:none}

  .wrap{position:relative;z-index:2;width:100%;max-width:680px;text-align:center}

  .eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--signal);opacity:.85}
  .blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}

  .qcard{
    margin-top:22px;background:var(--panel);border:1.5px solid var(--line);border-radius:24px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:44px 34px 38px;
    box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden;
  }
  .qcard::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gelb),transparent);opacity:.55}

  h1{font-size:clamp(1.7rem,4.6vw,2.7rem);font-weight:900;line-height:1.18;letter-spacing:-.02em}
  h1 .sub2{color:var(--signal);white-space:nowrap}
  h1 .me{color:var(--gelb)}

  .btns{position:relative;margin-top:38px;height:90px;display:flex;align-items:center;justify-content:center;gap:18px}
  button{font-family:'Inter';font-weight:800;cursor:pointer;border:none;transition:transform .12s}

  #ja{
    color:#15130a;background:var(--gelb);font-size:1.25rem;padding:16px 40px;border-radius:15px;
    box-shadow:0 10px 26px rgba(255,228,78,.30);transform-origin:center;will-change:transform;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,padding .25s,font-size .25s;
  }
  #ja:hover{transform:scale(1.06)}
  #ja:active{transform:scale(.97)}

  #nein{
    color:var(--txt);background:rgba(255,255,255,.06);border:1.5px solid var(--line);
    font-size:1.05rem;padding:14px 30px;border-radius:15px;
    transition:left .22s cubic-bezier(.22,1,.36,1),top .22s cubic-bezier(.22,1,.36,1),transform .2s,opacity .3s;
    will-change:left,top;
  }
  #nein.loose{position:fixed;z-index:5;margin:0}

  .counter{margin-top:24px;min-height:20px;font-family:var(--mono);font-size:.84rem;color:var(--muted);transition:.2s}
  .counter b{color:var(--gelb)}

  /* Toasts (Sprüche) */
  #toasts{position:fixed;inset:0;z-index:7;pointer-events:none}
  .toast{position:absolute;font-family:var(--mono);font-weight:700;font-size:.95rem;
    color:var(--signal);background:rgba(10,10,18,.82);border:1px solid var(--signal-soft);
    padding:8px 14px;border-radius:11px;white-space:nowrap;transform:translate(-50%,-50%) scale(.7);
    opacity:0;animation:toast 1.1s ease-out forwards}
  @keyframes toast{12%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-130%) scale(.95)}}

  /* Party */
  #party{position:relative;z-index:3;width:100%;max-width:680px;text-align:center;opacity:0;
    transform:translateY(20px);pointer-events:none;transition:opacity .6s,transform .6s}
  #party.show{opacity:1;transform:none;pointer-events:auto}
  .pheadline{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--gelb),var(--signal),var(--gelb));background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .psub{margin-top:10px;color:var(--muted);font-size:1.05rem}
  .decode-wrap{margin-top:34px;background:var(--panel);border:1.5px solid var(--signal-soft);border-radius:18px;
    padding:26px 22px;backdrop-filter:blur(8px)}
  .decode-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  #decoded{font-family:var(--mono);font-weight:700;font-size:clamp(1.5rem,5.5vw,2.6rem);letter-spacing:.14em;
    color:var(--signal);margin-top:14px;min-height:1.4em;text-shadow:0 0 24px rgba(84,230,197,.4)}
  .gift{margin-top:18px;font-size:1.05rem;color:var(--txt);opacity:0;transition:opacity .8s}
  .gift.show{opacity:1}

  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){.starfield{display:none}body.party{animation:none}}
</style>
</head>
<body>
<div class="starfield" id="stars" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<div id="toasts"></div>

<!-- FRAGE -->
<div class="wrap" id="ask">
  <div class="eyebrow" id="eyebrow">// Verbindung hergestellt<span class="blink">_</span></div>
  <div class="qcard" id="qcard" style="opacity:0;transform:translateY(14px);transition:.7s">
    <h1>Möchtest du <span class="sub2">Subnautica&nbsp;2</span><br>mit <span class="me">mir</span> spielen?</h1>
    <div class="btns">
      <button id="ja">Ja</button>
      <button id="nein">Nein</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<!-- PARTY -->
<div id="party">
  <div class="pheadline">JAAA!</div>
  <div class="psub">Wusste ich's doch. 💛</div>
  <div class="decode-wrap">
    <div class="decode-label">// Entschlüssele finale Nachricht</div>
    <div id="decoded"></div>
    <div class="gift" id="gift">Ein Geschenk wartet dort auf dich.</div>
  </div>
</div>

<script>
/* ───────── Sternenhimmel ───────── */
(function(){const s=document.getElementById('stars');for(let i=0;i<70;i++){const t=document.createElement('i');
  t.style.left=Math.random()*100+'vw';t.style.top=Math.random()*100+'vh';t.style.animationDelay=(Math.random()*4)+'s';
  const z=(Math.random()*1.6+1).toFixed(1);t.style.width=t.style.height=z+'px';s.appendChild(t);}})();

/* ───────── Intro-Beat ───────── */
setTimeout(()=>{const q=document.getElementById('qcard');q.style.opacity=1;q.style.transform='none';
  document.getElementById('eyebrow').innerHTML='// Eine letzte Frage<span class="blink">_</span>';
},1100);

/* ───────── Audio (winzig, vanilla) ───────── */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function blip(freq,dur,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||.04;o.connect(g);g.connect(c.destination);
  const t=c.currentTime;g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur);}
function fanfare(){const notes=[523.25,659.25,783.99,1046.5,1318.5];notes.forEach((f,i)=>setTimeout(()=>blip(f,.35,'triangle',.07),i*110));
  setTimeout(()=>{blip(1568,.5,'sine',.05);},620);}

/* ───────── Nein-Button: Ausweichen ───────── */
const nein=document.getElementById('nein'), ja=document.getElementById('ja'), counter=document.getElementById('counter');
let dodges=0, jaScale=1, lastDodge=0, loose=false, dodgingEnabled=true, fallbackUsed=false;

const NEIN_LABELS=["Nein","Nein?","Bist du sicher?","Wirklich jetzt?","Denk nochmal nach",
  "Falsche Taste!","Das war kein Angebot","Versuch's weiter","Niemals","fast…",
  "ok… fast","komm schon","doch Ja?","fein, ich versteck mich"];
const JA_LABELS=[[0,"Ja"],[2,"Ja!"],[4,"Ja!!"],[6,"JAAA!"],[9,"NA KLAR!"],[13,"JAAAA!"]];
const TAUNTS=["Zu langsam!","Knapp daneben!","Nice try","Nope.","Glitscht weg wie ein Peeper",
  "Schnell wie ein Reaper, was?","Nicht mit mir!","Falsche Richtung!","Du willst doch eh 'Ja'",
  "98% Ausweichquote","der Button trainiert für Olympia","war wohl nix"];

function goLoose(){
  if(loose) return;
  const r=nein.getBoundingClientRect();
  document.body.appendChild(nein);      // raus aus der Card → kein overflow/backdrop-filter-Clipping mehr
  nein.classList.add('loose');
  nein.style.left=r.left+'px';
  nein.style.top=r.top+'px';
  loose=true;
}

function dodge(){
  if(!dodgingEnabled) return;
  const now=Date.now(); if(now-lastDodge<200) return; lastDodge=now;
  goLoose();
  dodges++;
  const w=nein.offsetWidth, h=nein.offsetHeight, m=18;
  const maxX=Math.max(m, window.innerWidth - w - m);
  const maxY=Math.max(m, window.innerHeight - h - m);
  let bx=m, by=m, best=-1;
  for(let i=0;i<14;i++){
    const x=m+Math.random()*(maxX-m), y=m+Math.random()*(maxY-m);
    const dx=(x+w/2)-mouse.x, dy=(y+h/2)-mouse.y, d=dx*dx+dy*dy;
    if(d>best){best=d;bx=x;by=y;}
  }
  bx=Math.max(m,Math.min(maxX,bx)); by=Math.max(m,Math.min(maxY,by));
  nein.style.left=bx+'px'; nein.style.top=by+'px';
  // dezent schrumpfen, aber immer gut sichtbar
  const shrink=Math.max(.72, 1-dodges*0.03);
  nein.style.transform='scale('+shrink+')';
  nein.textContent=NEIN_LABELS[Math.min(dodges,NEIN_LABELS.length-1)];
  // Ja wächst
  jaScale=Math.min(2.8, jaScale*1.08);
  ja.style.transform='scale('+jaScale+')';
  let jl="Ja"; JA_LABELS.forEach(p=>{if(dodges>=p[0])jl=p[1];}); ja.textContent=jl;
  // Spruch + Sound
  toast(TAUNTS[Math.floor(Math.random()*TAUNTS.length)], bx+w/2, by);
  blip(220+Math.random()*120, .12, 'square', .035);
  updateCounter();
}

function updateCounter(){
  let msg;
  if(dodges<=0) msg="";
  else if(dodges<4) msg="Der 'Nein'-Button ist etwas… schüchtern.";
  else if(dodges<8) msg="Ausweichmanöver: <b>"+dodges+"</b> · beeindruckend hartnäckig.";
  else if(dodges<13) msg="<b>"+dodges+"</b> Versuche. Der Button bleibt ungeschlagen.";
  else msg="Gib's zu — du willst längst <b>Ja</b> drücken.";
  counter.innerHTML=msg;
}

/* Cursor-Tracking → fliehen wenn nah */
const mouse={x:-999,y:-999};
document.addEventListener('pointermove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  if(!loose) return;
  const r=nein.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const dist=Math.hypot(cx-mouse.x, cy-mouse.y);
  if(dist<95) dodge('near');
});
// direkte Versuche blocken
['mouseenter','pointerenter','pointerdown','touchstart'].forEach(ev=>{
  nein.addEventListener(ev,e=>{ if(ev==='touchstart'||ev==='pointerdown')e.preventDefault(); dodge('direct'); },{passive:false});
});
// falls sie es DOCH schafft (z.B. per Tastatur): nicht akzeptieren, sondern liebevoll umlenken
nein.addEventListener('click',e=>{e.preventDefault(); neinFallback();});

function neinFallback(){
  if(fallbackUsed) return; fallbackUsed=true; dodgingEnabled=false;
  ac(); nein.style.display='none';
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(8,8,14,.88);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:24px;text-align:center';
  const panel=document.createElement('div');
  panel.style.cssText='max-width:520px;background:var(--panel);border:1.5px solid var(--no);border-radius:20px;padding:38px 30px;box-shadow:0 30px 70px rgba(0,0,0,.55)';
  const line=document.createElement('div');
  line.style.cssText='font-family:var(--mono);font-size:clamp(1.05rem,3vw,1.25rem);line-height:1.55;color:var(--txt);min-height:3.2em';
  panel.appendChild(line); ov.appendChild(panel); document.body.appendChild(ov);
  const steps=[
    "Moment… du hast 'Nein' tatsächlich erwischt.",
    "Das hätte eigentlich gar nicht passieren dürfen.",
    "FEHLER 404 · Option 'Nein' nicht gefunden.",
    "System korrigiert deine Eingabe…",
    "Antwort wird gesetzt auf:  Ja."
  ];
  let i=0;
  (function next(){
    if(i<steps.length){
      line.textContent=steps[i];
      blip(300+i*70,.14,'square',.04);
      const last=(i===steps.length-1);
      i++;
      setTimeout(next, last?1500:1100);
    } else { ov.remove(); fanfare(); startParty(); }
  })();
}

/* ───────── Toast ───────── */
function toast(text,x,y){
  const t=document.createElement('div'); t.className='toast'; t.textContent=text;
  x=Math.max(70,Math.min(window.innerWidth-70,x)); y=Math.max(40,y);
  t.style.left=x+'px'; t.style.top=y+'px';
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),1150);
}

/* ───────── JA → Party ───────── */
ja.addEventListener('click',()=>{ ac(); fanfare(); startParty(); });

function startParty(){
  dodgingEnabled=false;
  nein.style.display='none';
  document.getElementById('ask').classList.add('hidden');
  document.body.classList.add('party');
  const p=document.getElementById('party'); p.classList.add('show');
  burst();
  setTimeout(()=>decode("SCHAU IN DEIN STEAM", document.getElementById('decoded'), ()=>{
    document.getElementById('gift').classList.add('show');
  }), 700);
}

/* ───────── Decode-Reveal ───────── */
function decode(target, el, done){
  const CH="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/<>";
  const arr=target.split(''); const locked=new Array(arr.length).fill(false);
  arr.forEach((c,i)=>{ if(c===' ') locked[i]=true; });
  const render=()=>el.textContent=arr.map((c,i)=>locked[i]?c:CH[Math.floor(Math.random()*CH.length)]).join('');
  const iv=setInterval(render,55);
  let i=0;
  (function lockNext(){
    while(i<arr.length && (arr[i]===' '||locked[i])) i++;
    if(i>=arr.length){ clearInterval(iv); el.textContent=target; blip(880,.4,'sine',.05); done&&done(); return; }
    locked[i]=true; blip(520+i*30,.12,'triangle',.04); i++;
    setTimeout(lockNext, 200);
  })();
}

/* ───────── Konfetti (Canvas) ───────── */
const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
function size(){cv.width=innerWidth;cv.height=innerHeight;} size(); addEventListener('resize',size);
let parts=[], raf=null;
function burst(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#FFE44E','#54E6C5','#ffffff','#FF6B7A','#7c6cff'];
  for(let i=0;i<220;i++) parts.push({
    x:innerWidth/2,y:innerHeight*0.42,
    vx:(Math.random()-.5)*16, vy:Math.random()*-14-4,
    g:.32+Math.random()*.15, s:5+Math.random()*7,
    c:cols[Math.floor(Math.random()*cols.length)], rot:Math.random()*6, vr:(Math.random()-.5)*.4, life:0
  });
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    ctx.globalAlpha=Math.max(0,1-p.life/170);ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.4);ctx.restore();});
  parts=parts.filter(p=>p.life<175 && p.y<innerHeight+40);
  if(parts.length) raf=requestAnimationFrame(loop); else {raf=null;ctx.clearRect(0,0,cv.width,cv.height);}
}
</script>
</body>
</html>
