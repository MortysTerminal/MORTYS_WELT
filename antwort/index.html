<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eine Frage an dich · Mortys Welt</title>
<link rel="icon" type="image/x-icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Mortys Welt CI: Gelb+Orange Kernfarben, Blau nur Tiefe */
    --bg:#202020; --panel:rgba(45,45,45,.58); --line:rgba(255,255,255,.10);
    --gelb:#F5C07C; --gelb-soft:rgba(245,192,124,.14);
    --signal:#F09346; --signal-soft:rgba(240,147,70,.14);
    --txt:#F0F0F0; --muted:rgba(240,240,240,.55); --no:#FF6B7A;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--txt);
    background:
      radial-gradient(1200px 760px at 16% -12%, rgba(245,192,124,.07), transparent 58%),
      radial-gradient(1000px 680px at 90% 112%, rgba(87,115,153,.14), transparent 60%),
      var(--bg);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 18px;overflow:hidden;position:relative;
  }
  body.party{animation:bgparty 2.2s linear infinite}
  @keyframes bgparty{
    0%{background-color:#202020}25%{background-color:#2b2416}
    50%{background-color:#1e2733}75%{background-color:#2d2216}100%{background-color:#202020}}

  .starfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .starfield i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}

  #fx{position:fixed;inset:0;z-index:6;pointer-events:none}

  .wrap{position:relative;z-index:2;width:100%;max-width:680px;text-align:center}

  .eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--signal);opacity:.85}
  .blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}

  .qcard{
    margin-top:22px;background:var(--panel);border:1.5px solid var(--line);border-radius:24px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:44px 34px 38px;
    box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden;
  }
  .qcard::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gelb),transparent);opacity:.55}

  h1{font-size:clamp(1.7rem,4.6vw,2.7rem);font-weight:900;line-height:1.18;letter-spacing:-.02em}
  h1 .sub2{color:var(--signal);white-space:nowrap}
  h1 .me{color:var(--gelb)}

  .btns{position:relative;margin-top:38px;height:90px;display:flex;align-items:center;justify-content:center;gap:18px}
  button{font-family:'Inter';font-weight:800;cursor:pointer;border:none;transition:transform .12s}

  #ja{
    color:#202020;background:var(--gelb);font-size:1.25rem;padding:16px 40px;border-radius:15px;
    box-shadow:0 10px 26px rgba(245,192,124,.30);transform-origin:center;will-change:transform;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,padding .25s,font-size .25s;
  }
  #ja:hover{transform:scale(1.06)}
  #ja:active{transform:scale(.97)}

  #nein{
    color:var(--txt);background:rgba(255,255,255,.06);border:1.5px solid var(--line);
    font-size:1.05rem;padding:14px 30px;border-radius:15px;
    transition:left .22s cubic-bezier(.22,1,.36,1),top .22s cubic-bezier(.22,1,.36,1),transform .2s,opacity .3s;
    will-change:left,top;
  }
  #nein.loose{position:fixed;z-index:5;margin:0}

  .counter{margin-top:24px;min-height:20px;font-family:var(--mono);font-size:.84rem;color:var(--muted);transition:.2s}
  .counter b{color:var(--gelb)}

  /* Toasts (Sprüche) */
  #toasts{position:fixed;inset:0;z-index:7;pointer-events:none}
  .toast{position:absolute;font-family:var(--mono);font-weight:700;font-size:.95rem;
    color:var(--signal);background:rgba(10,10,18,.82);border:1px solid var(--signal-soft);
    padding:8px 14px;border-radius:11px;white-space:nowrap;transform:translate(-50%,-50%) scale(.7);
    opacity:0;animation:toast 1.1s ease-out forwards}
  @keyframes toast{12%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-130%) scale(.95)}}

  /* Party */
  #party{position:relative;z-index:3;width:100%;max-width:680px;text-align:center;opacity:0;
    transform:translateY(20px);pointer-events:none;transition:opacity .6s,transform .6s}
  #party.show{opacity:1;transform:none;pointer-events:auto}
  .pheadline{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--gelb),var(--signal),var(--gelb));background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .psub{margin-top:10px;color:var(--muted);font-size:1.05rem}
  .decode-wrap{margin-top:34px;background:var(--panel);border:1.5px solid var(--signal-soft);border-radius:18px;
    padding:26px 22px;backdrop-filter:blur(8px)}
  .decode-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  #decoded{font-family:var(--mono);font-weight:700;font-size:clamp(1.5rem,5.5vw,2.6rem);letter-spacing:.14em;
    color:var(--signal);margin-top:14px;min-height:1.4em;text-shadow:0 0 24px rgba(240,147,70,.4)}
  .gift{margin-top:18px;font-size:1.05rem;color:var(--txt);opacity:0;transition:opacity .8s}
  .gift.show{opacity:1}

  /* ── Zufalls-Gag-Layer ── */
  .decoy{position:fixed;z-index:4;color:var(--txt);background:rgba(255,255,255,.05);
    border:1.5px solid var(--line);border-radius:15px;font-family:'Inter';font-weight:800;
    padding:11px 22px;font-size:.92rem;cursor:pointer;transition:opacity .2s,transform .2s;
    animation:decoyIn .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes decoyIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  .shakefx{animation:shakefx .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shakefx{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}
    30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  #nein.waddle{animation:waddle .5s ease-in-out infinite}
  @keyframes waddle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){
    .starfield{display:none}body.party{animation:none}
    .shakefx,#nein.waddle,.decoy{animation:none !important}
  }
</style>
</head>
<body>
<div class="starfield" id="stars" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<div id="toasts"></div>

<!-- FRAGE -->
<div class="wrap" id="ask">
  <div class="eyebrow" id="eyebrow">// Verbindung hergestellt<span class="blink">_</span></div>
  <div class="qcard" id="qcard" style="opacity:0;transform:translateY(14px);transition:.7s">
    <h1>Möchtest du <span class="sub2">Subnautica&nbsp;2</span><br>mit <span class="me">mir</span> spielen?</h1>
    <div class="btns">
      <button id="ja">Ja</button>
      <button id="nein">Nein</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<!-- PARTY -->
<div id="party">
  <div class="pheadline">JAAA!</div>
  <div class="psub">Wusste ich's doch. 💛</div>
  <div class="decode-wrap">
    <div class="decode-label">// Entschlüssele finale Nachricht</div>
    <div id="decoded"></div>
    <div class="gift" id="gift">Ein Geschenk wartet dort auf dich.</div>
  </div>
</div>

<script>
/* ───────── Sternenhimmel ───────── */
(function(){const s=document.getElementById('stars');for(let i=0;i<70;i++){const t=document.createElement('i');
  t.style.left=Math.random()*100+'vw';t.style.top=Math.random()*100+'vh';t.style.animationDelay=(Math.random()*4)+'s';
  const z=(Math.random()*1.6+1).toFixed(1);t.style.width=t.style.height=z+'px';s.appendChild(t);}})();

/* ───────── Intro-Beat ───────── */
setTimeout(()=>{const q=document.getElementById('qcard');q.style.opacity=1;q.style.transform='none';
  document.getElementById('eyebrow').innerHTML='// Eine letzte Frage<span class="blink">_</span>';
},1100);

/* ───────── Audio (winzig, vanilla) ───────── */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function blip(freq,dur,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||.04;o.connect(g);g.connect(c.destination);
  const t=c.currentTime;g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur);}
function fanfare(){const notes=[523.25,659.25,783.99,1046.5,1318.5];notes.forEach((f,i)=>setTimeout(()=>blip(f,.35,'triangle',.07),i*110));
  setTimeout(()=>{blip(1568,.5,'sine',.05);},620);}

/* ───────── Nein-Button: Ausweichen ───────── */
const nein=document.getElementById('nein'), ja=document.getElementById('ja'), counter=document.getElementById('counter');
let dodges=0, jaScale=1, lastDodge=0, loose=false, dodgingEnabled=true, surrendered=false;
let swapped=false, cdBusy=false, lastGag='', decoys=[], gagLock=false, dialogSeen=false, dialogOpen=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const NEIN_LABELS=["Nein","Nein?","Bist du sicher?","Wirklich jetzt?","Denk nochmal nach",
  "Falsche Taste!","Das war kein Angebot","Versuch's weiter","Niemals","fast…",
  "ok… fast","komm schon","doch Ja?","fein, ich versteck mich"];
const JA_LABELS=[[0,"Ja"],[2,"Ja!"],[4,"Ja!!"],[6,"JAAA!"],[9,"NA KLAR!"],[13,"JAAAA!"]];
const TAUNTS=["Zu langsam!","Knapp daneben!","Nice try","Nope.","Glitscht weg wie ein Peeper",
  "Schnell wie ein Reaper, was?","Nicht mit mir!","Falsche Richtung!","Du willst doch eh 'Ja'",
  "98% Ausweichquote","der Button trainiert für Olympia","war wohl nix"];
const INSIDERS=["Hatschi. 🤧 Ein Paket? Bin allergisch, weißt du doch.",
  "In Goose Goose Duck killst du mich eh jede Runde.",
  "Nein? Sagt die, die mich als Ente cosplayen ließ.",
  "Wubba lubba dub… nein, falscher Morty."];

function goLoose(){
  if(loose) return;
  const r=nein.getBoundingClientRect();
  document.body.appendChild(nein);      // raus aus der Card → kein overflow/backdrop-filter-Clipping mehr
  nein.classList.add('loose');
  nein.style.left=r.left+'px';
  nein.style.top=r.top+'px';
  loose=true;
}

function dodge(){
  if(!dodgingEnabled || gagLock) return;
  const now=Date.now(); if(now-lastDodge<200) return; lastDodge=now;
  goLoose();
  dodges++;
  const w=nein.offsetWidth, h=nein.offsetHeight, m=18;
  const maxX=Math.max(m, window.innerWidth - w - m);
  const maxY=Math.max(m, window.innerHeight - h - m);
  let bx=m, by=m, best=-1;
  for(let i=0;i<14;i++){
    const x=m+Math.random()*(maxX-m), y=m+Math.random()*(maxY-m);
    const dx=(x+w/2)-mouse.x, dy=(y+h/2)-mouse.y, d=dx*dx+dy*dy;
    if(d>best){best=d;bx=x;by=y;}
  }
  bx=Math.max(m,Math.min(maxX,bx)); by=Math.max(m,Math.min(maxY,by));
  nein.style.left=bx+'px'; nein.style.top=by+'px';
  // dezent schrumpfen, aber immer gut sichtbar
  const shrink=Math.max(.72, 1-dodges*0.03);
  nein.style.transform='scale('+shrink+')';
  if(!swapped) nein.textContent=NEIN_LABELS[Math.min(dodges,NEIN_LABELS.length-1)];
  // Ja wächst
  jaScale=Math.min(2.8, jaScale*1.08);
  ja.style.transform='scale('+jaScale+')';
  let jl="Ja"; JA_LABELS.forEach(p=>{if(dodges>=p[0])jl=p[1];}); if(!swapped) ja.textContent=jl;
  // Spruch + Sound
  toast(TAUNTS[Math.floor(Math.random()*TAUNTS.length)], bx+w/2, by);
  blip(220+Math.random()*120, .12, 'square', .035);
  updateCounter();
  runGag(bx+w/2, by);                        // Zufalls-Gag drüberlegen
  if(dodges===6 && !dialogSeen){ dialogSeen=true; errorDialog(); } // einmaliger Fake-Fehler
  if(dodges>=14) setTimeout(surrender, 420); // irgendwann gibt er auf
}

function updateCounter(){
  let msg;
  if(dodges<=0) msg="";
  else if(dodges<4) msg="Der 'Nein'-Button ist etwas… schüchtern.";
  else if(dodges<8) msg="Ausweichmanöver: <b>"+dodges+"</b> · beeindruckend hartnäckig.";
  else if(dodges<13) msg="<b>"+dodges+"</b> Versuche. Der Button bleibt ungeschlagen.";
  else msg="Gib's zu — du willst längst <b>Ja</b> drücken.";
  counter.innerHTML=msg;
}

/* Cursor-Tracking → fliehen wenn nah */
const mouse={x:-999,y:-999};
document.addEventListener('pointermove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  if(!loose) return;
  const r=nein.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const dist=Math.hypot(cx-mouse.x, cy-mouse.y);
  if(dist<95) dodge('near');
});
// direkte Versuche blocken
['mouseenter','pointerenter','pointerdown','touchstart'].forEach(ev=>{
  nein.addEventListener(ev,e=>{ if(ev==='touchstart'||ev==='pointerdown')e.preventDefault(); dodge('direct'); },{passive:false});
});
// falls sie ihn DOCH erwischt (z.B. per Tastatur): der Knopf kapituliert und watschelt rüber
nein.addEventListener('click',e=>{e.preventDefault(); surrender();});

/* ───────── Zufalls-Gag-Mix ───────── */
function runGag(x,y){
  if(surrendered || gagLock) return;
  const roll=Math.random();
  let g='';
  if(roll<0.45)        g='';           // meistens: nur normales Fliehen
  else if(roll<0.53)   g='insider';
  else if(roll<0.60)   g='roar';
  else if(roll<0.66)   g='bait';
  else if(roll<0.71)   g='hydra';
  else if(roll<0.76)   g='warp';
  else if(roll<0.81)   g='polyglott';
  else if(roll<0.86)   g='giant';
  else if(roll<0.90)   g='cloak';
  else if(roll<0.935)  g='gravity';
  else if(roll<0.965)  g='peeper';
  else                 g='countdown';
  if(g===lastGag && g!=='') g='';      // nicht zweimal derselbe Gag am Stück
  lastGag=g;
  if(g==='insider')        insiderToast(x,y);
  else if(g==='roar')      roar(x,y);
  else if(g==='bait')      baitSwitch();
  else if(g==='hydra')     hydra();
  else if(g==='warp')      warp(x,y);
  else if(g==='polyglott') polyglott();
  else if(g==='giant')     giant(x,y);
  else if(g==='cloak')     cloak(x,y);
  else if(g==='gravity')   gravity(x,y);
  else if(g==='peeper')    peeper(x,y);
  else if(g==='countdown') countdownFake(x,y);
}

function insiderToast(x,y){ toast(INSIDERS[Math.floor(Math.random()*INSIDERS.length)], x, y-30); }

/* Kurzer, leiser Reaper-Roar + dezentes Ruckeln */
function roar(x,y){
  toast("Detected: 1 Leviathan class lifeform.", x, y-30);
  blip(90,.5,'sawtooth',.05); setTimeout(()=>blip(58,.55,'sine',.045),90);
  if(!reduce){ const wrap=document.querySelector('.wrap');
    wrap.classList.remove('shakefx'); void wrap.offsetWidth; wrap.classList.add('shakefx'); }
}

/* Warper-Teleport: Knopf wird eingesaugt und taucht anderswo wieder auf */
function warp(x,y){
  toast("Ein Warper hat den Knopf versetzt.", x, y-30);
  blip(880,.08,'sine',.05); setTimeout(()=>blip(180,.14,'sawtooth',.045),70);
  if(reduce || gagLock) return; gagLock=true;
  const w=nein.offsetWidth, h=nein.offsetHeight, m=18;
  nein.style.transition='transform .12s, opacity .12s';
  nein.style.transform='scale(.2)'; nein.style.opacity='0';                 // einsaugen
  setTimeout(()=>{
    nein.style.transition='none';                                          // instant versetzen
    nein.style.left=(m+Math.random()*(window.innerWidth -w-2*m))+'px';
    nein.style.top =(m+Math.random()*(window.innerHeight-h-2*m))+'px';
    requestAnimationFrame(()=>{
      nein.style.transition='transform .18s cubic-bezier(.34,1.56,.64,1), opacity .18s';
      nein.style.transform=''; nein.style.opacity='1';                     // auftauchen
      setTimeout(()=>{ nein.style.transition=''; gagLock=false; }, 220);
    });
  }, 130);
}

/* Größen-Troll: wird kurz riesig ("den triffst du DOCH") und schrumpft dann weg */
function giant(x,y){
  toast("Na, DEN triffst du ja wohl.", x, y-30); blip(500,.12,'triangle',.04);
  if(reduce || gagLock) return; gagLock=true;
  nein.style.transition='transform .3s cubic-bezier(.34,1.56,.64,1)';
  nein.style.transform='scale(2.4)';
  setTimeout(()=>{
    nein.style.transform='scale(.55)'; blip(240,.14,'square',.04);
    const r=nein.getBoundingClientRect(); toast("…ups. Doch nicht.", r.left+r.width/2, r.top);
    setTimeout(()=>{ nein.style.transition=''; nein.style.transform=''; gagLock=false; }, 340);
  }, 900);
}

/* Tarnung: Cyclops Silent Running — Knopf wird "unsichtbar", nur der Umriss bleibt */
function cloak(x,y){
  toast("Cyclops: Silent Running aktiviert.", x, y-30); blip(300,.3,'sine',.03);
  if(reduce || gagLock) return; gagLock=true;
  nein.style.transition='background .4s, color .4s';
  nein.style.background='transparent'; nein.style.color='transparent';     // nur die Border bleibt
  setTimeout(()=>{
    nein.style.background=''; nein.style.color='';
    setTimeout(()=>{ nein.style.transition=''; gagLock=false; }, 420);
  }, 1200);
}

/* Schwerkraft: Knopf fällt unten raus und plumpst oben wieder rein */
function gravity(x,y){
  toast("Ups — Schwerkraft.", x, y-30);
  if(reduce || gagLock){ blip(120,.2,'sawtooth',.04); return; } gagLock=true;
  blip(200,.5,'sawtooth',.04);
  const w=nein.offsetWidth, h=nein.offsetHeight, m=18;
  nein.style.transition='top .6s cubic-bezier(.5,0,.9,.3)';
  nein.style.top=(window.innerHeight+90)+'px';                              // rausfallen
  setTimeout(()=>{
    nein.style.transition='none';
    nein.style.top=(-h-30)+'px';
    nein.style.left=(m+Math.random()*(window.innerWidth-w-2*m))+'px';
    requestAnimationFrame(()=>{
      nein.style.transition='top .55s cubic-bezier(.34,1.7,.6,1)';
      nein.style.top=(m+Math.random()*(window.innerHeight*0.5))+'px';       // wieder reinplumpsen
      setTimeout(()=>{ nein.style.transition=''; gagLock=false; }, 580);
    });
  }, 640);
}

/* Peeper frisst den Knopf: ein Fisch schwimmt durch, verschluckt ihn, spuckt ihn woanders aus */
function peeper(x,y){
  toast("Ein Peeper hat ihn geschluckt.", x, y-30);
  if(reduce || gagLock){ blip(400,.1,'square',.03); return; } gagLock=true;
  const r=nein.getBoundingClientRect();
  const fish=document.createElement('div'); fish.textContent='🐟';
  fish.style.cssText='position:fixed;z-index:6;font-size:40px;pointer-events:none;left:-70px;top:'+(r.top-6)+'px;transition:left 1.1s linear';
  document.body.appendChild(fish);
  requestAnimationFrame(()=>{ fish.style.left=(window.innerWidth+70)+'px'; });
  const eat=Math.max(60, ((r.left+70)/(window.innerWidth+140))*1100);
  setTimeout(()=>{ nein.style.transition='opacity .12s'; nein.style.opacity='0'; blip(300,.12,'square',.035); }, eat);
  setTimeout(()=>{
    const w=nein.offsetWidth, h=nein.offsetHeight, m=18;
    nein.style.transition='none';
    nein.style.left=(m+Math.random()*(window.innerWidth-w-2*m))+'px';
    nein.style.top =(m+Math.random()*(window.innerHeight-h-2*m))+'px';
    requestAnimationFrame(()=>{
      nein.style.transition='opacity .25s'; nein.style.opacity='1';
      const rr=nein.getBoundingClientRect(); toast("…pfff, wieder ausgespuckt.", rr.left+rr.width/2, rr.top);
      blip(520,.12,'triangle',.04);
      setTimeout(()=>{ nein.style.transition=''; gagLock=false; }, 280);
    });
  }, eat+320);
  setTimeout(()=>fish.remove(), 1250);
}

/* Fake-Fehlerdialog: "Nein.exe funktioniert nicht mehr" — Ausgang nur über "Trotzdem Ja" */
function errorDialog(){
  if(dialogOpen || surrendered) return; dialogOpen=true;
  blip(196,.22,'square',.05); setTimeout(()=>blip(147,.28,'square',.05),120);   // Windows-Fehlerton-Anmutung
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(8,8,14,.55);padding:20px';
  const win=document.createElement('div');
  win.style.cssText='width:min(390px,92vw);background:#2D2D2D;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6);font-family:var(--mono)';
  win.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--signal),var(--gelb));color:#202020;padding:9px 12px;font-weight:800;font-size:.82rem">'
    +'<span>Nein.exe</span><span id="dx" style="cursor:pointer;padding:0 6px">×</span></div>'
    +'<div style="padding:20px 18px 22px;color:var(--txt)">'
    +'<p style="font-size:.9rem;line-height:1.55">⚠ Ein Problem hat dazu geführt, dass <b>Nein</b> nicht mehr korrekt funktioniert. '
    +'Windows sucht nach einer Lösung… gefunden wurde nur <b>Ja</b>.</p>'
    +'<div style="display:flex;justify-content:flex-end;margin-top:20px">'
    +'<button id="dja" style="font-family:\'Inter\';font-weight:800;cursor:pointer;border:none;color:#202020;background:var(--gelb);padding:10px 22px;border-radius:9px">Trotzdem Ja</button>'
    +'</div></div>';
  ov.appendChild(win); document.body.appendChild(ov);
  const close=()=>{ ov.remove(); dialogOpen=false; };
  win.querySelector('#dx').addEventListener('click',()=>{ close(); toast("Weggeklickt. Der Knopf flieht einfach weiter.", window.innerWidth/2, window.innerHeight*0.4); blip(200,.1,'square',.03); });
  win.querySelector('#dja').addEventListener('click',()=>{ close(); ac(); fanfare(); startParty(); });
}

/* Polyglott: der Knopf sagt hektisch in vielen Sprachen "Nein" */
function polyglott(){
  if(swapped) return;
  const NOS=["Nein","No","Non","Nope","Nyet","Iie","Nej","Nee","Ei","Não","…nein"];
  let i=0; const iv=setInterval(()=>{
    if(swapped || surrendered){ clearInterval(iv); return; }
    nein.textContent=NOS[i%NOS.length]; blip(300+(i%6)*45,.05,'square',.022); i++;
    if(i>=14){ clearInterval(iv); nein.textContent=NEIN_LABELS[Math.min(dodges,NEIN_LABELS.length-1)]; }
  }, 95);
}

/* Fake-Countdown, der auf "Ja" umkippt statt zu akzeptieren */
function countdownFake(x,y){
  if(cdBusy) return; cdBusy=true;
  const seq=["Nein akzeptiert in 3…","2…","1…","…Ja. 💛"];
  let i=0;
  (function step(){
    if(i<seq.length){ toast(seq[i], x, y-30); blip(360+i*80,.12,'square',.035);
      const last=(i===seq.length-1); i++; setTimeout(step, last?700:520); }
    else cdBusy=false;
  })();
}

/* Bait & Switch: Ja und Nein tauschen kurz die Beschriftung */
function baitSwitch(){
  if(swapped) return; swapped=true;
  nein.textContent='Ja'; ja.textContent='Nein';
  toast("Moment — welcher war nochmal welcher?", window.innerWidth/2, window.innerHeight*0.4);
  blip(500,.12,'triangle',.04);
  setTimeout(()=>{ swapped=false;
    nein.textContent=NEIN_LABELS[Math.min(dodges,NEIN_LABELS.length-1)];
    let jl="Ja"; JA_LABELS.forEach(p=>{if(dodges>=p[0])jl=p[1];}); ja.textContent=jl;
  }, 1700);
}

/* Button-Hydra: zwei Schein-Neins stieben auseinander und lösen sich auf */
function hydra(){
  if(decoys.length>4) return;
  toast("Er teilt sich! Wie ein Peeper-Schwarm.", window.innerWidth/2, window.innerHeight*0.4);
  const w=110, h=44, m=20;
  for(let k=0;k<2;k++){
    const d=document.createElement('button'); d.className='decoy'; d.type='button';
    d.textContent=['Nein','Nö','Niemals','doch nicht'][Math.floor(Math.random()*4)];
    d.style.left=(m+Math.random()*(window.innerWidth-w-2*m))+'px';
    d.style.top =(m+Math.random()*(window.innerHeight-h-2*m))+'px';
    d.addEventListener('click',ev=>{ ev.preventDefault();
      toast("Auch nur eine Fata Morgana.", parseInt(d.style.left)+w/2, parseInt(d.style.top));
      blip(200,.1,'square',.03); killDecoy(d); });
    document.body.appendChild(d); decoys.push(d);
    setTimeout(()=>killDecoy(d), 2200+Math.random()*600);
  }
  blip(300,.14,'triangle',.04);
}
function killDecoy(d){ const i=decoys.indexOf(d); if(i>=0) decoys.splice(i,1);
  if(d.parentNode){ d.style.opacity='0'; d.style.transform='scale(.4)'; setTimeout(()=>d.remove(),200); } }

/* ───────── Payoff: Nein kapituliert & watschelt zu Ja ───────── */
function surrender(){
  if(surrendered) return; surrendered=true; dodgingEnabled=false; swapped=false; cdBusy=false;
  ac(); decoys.slice().forEach(killDecoy);
  goLoose();                                   // sicherstellen: frei positioniert
  nein.textContent="ok, ok… ich will auch nicht mehr";
  nein.style.transform='';
  toast("…ganz ehrlich, Subnautica klingt super.", window.innerWidth/2, window.innerHeight*0.35);
  const goParty=()=>{ nein.style.display='none'; fanfare(); startParty(); };
  if(reduce){ setTimeout(goParty, 600); return; }
  const jr=ja.getBoundingClientRect();
  const jaS=Math.min(3, jaScale*1.15);
  ja.style.transform='scale('+jaS+')';
  nein.classList.add('waddle');
  const TRAVEL=2400;                                    // deutlich langsamer rüberwatscheln
  nein.style.transition='left '+TRAVEL+'ms ease-in-out, top '+TRAVEL+'ms ease-in-out';
  requestAnimationFrame(()=>{
    nein.style.left=(jr.left+jr.width/2 - nein.offsetWidth/2)+'px';
    nein.style.top =(jr.top +jr.height/2 - nein.offsetHeight/2)+'px';
  });
  // Ankommen → sichtbar auf den Ja-Knopf drücken
  setTimeout(()=>{
    nein.classList.remove('waddle');
    ja.style.transition='transform .12s ease-in';
    ja.style.transform='scale('+(jaS*0.8)+')';          // Ja wird eingedrückt
    nein.style.transition='transform .3s ease, opacity .3s';
    nein.style.transform='scale(.12)'; nein.style.opacity='0';   // Nein verschmilzt hinein
    blip(140,.2,'square',.055);                         // "thunk"
    setTimeout(()=>{ ja.style.transition='transform .34s cubic-bezier(.34,1.56,.64,1)';
      ja.style.transform='scale('+jaS+')'; }, 140);     // Ja federt zurück
    setTimeout(goParty, 560);
  }, TRAVEL);
}

/* ───────── Toast ───────── */
function toast(text,x,y){
  const t=document.createElement('div'); t.className='toast'; t.textContent=text;
  x=Math.max(70,Math.min(window.innerWidth-70,x)); y=Math.max(40,y);
  t.style.left=x+'px'; t.style.top=y+'px';
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),1150);
}

/* ───────── JA → Party ───────── */
ja.addEventListener('click',()=>{ ac(); fanfare(); startParty(); });

function startParty(){
  dodgingEnabled=false;
  nein.style.display='none';
  document.getElementById('ask').classList.add('hidden');
  document.body.classList.add('party');
  const p=document.getElementById('party'); p.classList.add('show');
  burst();
  setTimeout(()=>decode("SCHAU IN DEIN STEAM", document.getElementById('decoded'), ()=>{
    document.getElementById('gift').classList.add('show');
  }), 700);
}

/* ───────── Decode-Reveal ───────── */
function decode(target, el, done){
  const CH="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/<>";
  const arr=target.split(''); const locked=new Array(arr.length).fill(false);
  arr.forEach((c,i)=>{ if(c===' ') locked[i]=true; });
  const render=()=>el.textContent=arr.map((c,i)=>locked[i]?c:CH[Math.floor(Math.random()*CH.length)]).join('');
  const iv=setInterval(render,55);
  let i=0;
  (function lockNext(){
    while(i<arr.length && (arr[i]===' '||locked[i])) i++;
    if(i>=arr.length){ clearInterval(iv); el.textContent=target; blip(880,.4,'sine',.05); done&&done(); return; }
    locked[i]=true; blip(520+i*30,.12,'triangle',.04); i++;
    setTimeout(lockNext, 200);
  })();
}

/* ───────── Konfetti (Canvas) ───────── */
const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
function size(){cv.width=innerWidth;cv.height=innerHeight;} size(); addEventListener('resize',size);
let parts=[], raf=null;
function burst(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#F5C07C','#F09346','#F0F0F0','#577399','#ffffff'];
  for(let i=0;i<220;i++) parts.push({
    x:innerWidth/2,y:innerHeight*0.42,
    vx:(Math.random()-.5)*16, vy:Math.random()*-14-4,
    g:.32+Math.random()*.15, s:5+Math.random()*7,
    c:cols[Math.floor(Math.random()*cols.length)], rot:Math.random()*6, vr:(Math.random()-.5)*.4, life:0
  });
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    ctx.globalAlpha=Math.max(0,1-p.life/170);ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.4);ctx.restore();});
  parts=parts.filter(p=>p.life<175 && p.y<innerHeight+40);
  if(parts.length) raf=requestAnimationFrame(loop); else {raf=null;ctx.clearRect(0,0,cv.width,cv.height);}
}
</script>
